<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KIBEROV</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <header class="navhm">
            <div class="brand">KIBEROV</div>
            <nav class="nav">
                <button class="navbtn navhome" type="button" aria-label="home">home</button>
                <button class="navbtn navproj" type="button" aria-label="projects">projects</button>
                <button class="navbtn navcontact" type="button" aria-label="contact">contact</button>
            </nav>
        </header>

        <main id="main" role="main">
            <section id="homeview" class="view active">
                <div class="hero">
                    <h1 class="title">home</h1>
                    <p class="lead">home layout</p>
                </div>

                <div class="iconrow" role="navigation" aria-label="desktop shortcuts">
                    <button class="deskico projicon" type="button" aria-label="open projects" title="projects">
                        <div class="icotitle">projects</div>
                    </button>

                    <button class="deskico contacticon" type="button" aria-label="open contact" title="contact">
                        <div class="icotitle">contact</div>
                    </button>
                </div>

            </section>

            <section id="projectsview" class="view">
                <div class="desktop" role="region" aria-label="projects desktop">
                    <button class="folder" type="button" data-name="proj1" aria-label="proj1">
                        <div class="foldericon" aria-hidden="true"></div>
                        <div class="folderlabel">proj1</div>
                    </button>

                    <button class="folder" type="button" data-name="proj2" aria-label="proj2">
                        <div class="foldericon" aria-hidden="true"></div>
                        <div class="folderlabel">proj2</div>
                    </button>

                    <button class="folder" type="button" data-name="proj3" aria-label="proj3">
                        <div class="foldericon" aria-hidden="true"></div>
                        <div class="folderlabel">proj3</div>
                    </button>
                </div>
            </section>

            <section id="contactview" class="view">
            </section>
        </main>

        <div class="taskbar" role="navigation" aria-label="taskbar">
            <button class="startbtn" type="button" aria-label="start">start</button>
            <div class="taskarea" aria-hidden="true"></div>
            <div class="tasksep" aria-hidden="true"></div>
            <div class="clock" aria-label="clock" role="status">--:--</div>
        </div>

        <script src="script.js"></script>
    </div>
</body>

</html>
